<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Classes | Titanium Fitness</title>
    <style>
      body {
        margin: 0;
        font: 15px Arial;
        color: #101826;
        background: #fffaf4;
      }
      header {
        background: #101826;
        color: white;
        padding: 20px 7%;
        display: flex;
        justify-content: space-between;
      }
      a {
        color: #ee4b3d;
        text-decoration: none;
      }
      .wrap {
        max-width: 900px;
        margin: 38px auto;
        padding: 0 20px;
      }
      .class {
        background: white;
        border: 1px solid #e4e7ed;
        border-radius: 12px;
        padding: 20px;
        margin: 14px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .class p {
        color: #677080;
      }
      button {
        background: #ee4b3d;
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 11px 15px;
        font-weight: bold;
        cursor: pointer;
      }
      @media (max-width: 550px) {
        .class {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <b>TITANIUM <span style="color: #ee4b3d">FITNESS</span></b
      ><a href="dashboard.html">Member portal</a>
    </header>
    <main class="wrap">
      <p style="color: #ee4b3d; font-weight: bold">GROUP FITNESS</p>
      <h1>Find your next class.</h1>
      <div id="classes">
        <article class="class">
          <div>
            <h2>Morning Yoga</h2>
            <p>07:00–08:00 · Studio A · Priya Sharma · 8 spots left</p>
          </div>
          <button onclick="book(this)">Book class</button>
        </article>
        <article class="class">
          <div>
            <h2>HIIT Circuit</h2>
            <p>18:30–19:15 · Studio B · Aman Patel · 3 spots left</p>
          </div>
          <button onclick="book(this)">Book class</button>
        </article>
        <article class="class">
          <div>
            <h2>Strength Foundations</h2>
            <p>19:30–20:30 · Gym Floor · Rohan Das · 12 spots left</p>
          </div>
          <button onclick="book(this)">Book class</button>
        </article>
      </div>
    </main>
    <script>
      function book(button) {
    const classCard = button.closest(".class");
    const details = classCard.querySelector("p");
    const spotsMatch = details.textContent.match(/(\d+)\s+spots left/i);

    if (!spotsMatch) {
        alert("Booking information is unavailable.");
        return;
    }

    const spotsLeft = Number(spotsMatch[1]);

    if (spotsLeft <= 0) {
        alert("Sorry! This class is fully booked.");
        button.disabled = true;
        return;
    }

    details.textContent = details.textContent.replace(
        /\d+\s+spots left/i,
        `${spotsLeft - 1} spots left`
    );

    button.textContent = "Booked ✓";
    button.disabled = true;
    button.style.backgroundColor = "#27834a";

    alert("Class booked successfully!");
}
    </script>
  </body>
</html>
